<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            text-align: center; 
        }
        #hasil { 
            margin-top: 20px; 
            padding: 20px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            background: #f9f9f9; 
            display: inline-block;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Menampilkan teks loading sebelum data masuk -->
    <div id="hasil" class="loading">Menghubungkan ke server... mohon tunggu.</div>

    <script>
        // URL Apps Script Anda sudah dimasukkan
        const urlAppsScript = 'https://script.google.com/macros/s/AKfycbyJbFf2DcqfWI6mkJe-LlBGNccqyhaqJP8cDHjKoo47IICkRSloCJOP62joeEVih7Ve/exec';

        // Menjalankan fungsi otomatis saat halaman selesai dimuat
        window.onload = function() {
            const divHasil = document.getElementById('hasil');

            // Mengambil data dari Apps Script menggunakan fetch
            fetch(urlAppsScript)
                .then(response => response.json())
                .then(data => {
                    // Hapus efek teks loading dan tampilkan data
                    divHasil.classList.remove('loading');
                    divHasil.innerHTML = `<strong>Status:</strong> ${data.status} <br><br> <strong>Pesan:</strong> ${data.pesan}`;
                })
                .catch(error => {
                    divHasil.classList.remove('loading');
                    divHasil.innerHTML = `<span style="color:red;">Gagal mengambil data. Pastikan file ini sudah di-hosting secara online (bukan dibuka langsung dari folder komputer).</span>`;
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
